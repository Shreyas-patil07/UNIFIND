name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint and Test Backend
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      
      - name: Run Ruff linter
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check . --output-format=github
        continue-on-error: false
      
      - name: Run Black formatter check
        working-directory: ./backend
        run: |
          pip install black
          black --check --diff .
        continue-on-error: false
      
      - name: Run isort import check
        working-directory: ./backend
        run: |
          pip install isort
          isort --check-only --diff .
        continue-on-error: false
      
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          FIREBASE_PROJECT_ID: test-project
          FIREBASE_PRIVATE_KEY_ID: test-key-id
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_CLIENT_ID: "123456789"
          FIREBASE_CLIENT_CERT_URL: https://test.com
          GEMINI_API_KEY: test-gemini-key
          CLOUDINARY_CLOUD_NAME: test-cloud
          CLOUDINARY_API_KEY: test-key
          CLOUDINARY_API_SECRET: test-secret
          GMAIL_USER: test@gmail.com
          GMAIL_APP_PASSWORD: test-password
          CORS_ORIGINS: http://localhost:3000
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=60 \
            -v
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        if: always()
      
      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
        if: always()
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
      
      - name: Run Safety check (dependency vulnerabilities)
        working-directory: ./backend
        run: |
          safety check --file requirements.txt --output text
        continue-on-error: true
      
      - name: Run Bandit (security linter)
        working-directory: ./backend
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f screen
        continue-on-error: true
  
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t unifind-backend:${{ github.sha }} .
      
      - name: Test Docker image
        run: |
          docker run --rm unifind-backend:${{ github.sha }} python --version
      
      # Uncomment to push to registry
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
