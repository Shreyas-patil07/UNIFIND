name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting
      working-directory: ./backend
      run: |
        ruff check app tests || true
        black --check app tests || true
    
    - name: Run tests with coverage
      working-directory: ./backend
      env:
        ENVIRONMENT: test
        FIREBASE_PROJECT_ID: test-project
        FIREBASE_PRIVATE_KEY_ID: test-key-id
        FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"
        FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
        FIREBASE_CLIENT_ID: "123456789"
        FIREBASE_CLIENT_CERT_URL: https://test.com
        GEMINI_API_KEY: test-gemini-key
        CLOUDINARY_CLOUD_NAME: test-cloud
        CLOUDINARY_API_KEY: test-key
        CLOUDINARY_API_SECRET: test-secret
        GMAIL_USER: test@gmail.com
        GMAIL_APP_PASSWORD: test-password
        CORS_ORIGINS: http://localhost:3000
      run: |
        python -m pytest -v --cov=app --cov-report=xml --cov-report=term --tb=short
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-${{ matrix.python-version }}
        fail_ci_if_error: false
    
    - name: Run security checks
      working-directory: ./backend
      run: |
        bandit -r app -ll || true
        safety check || true
  
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run integration tests
      working-directory: ./backend
      env:
        ENVIRONMENT: test
        FIREBASE_PROJECT_ID: test-project
        FIREBASE_PRIVATE_KEY_ID: test-key-id
        FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"
        FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
        FIREBASE_CLIENT_ID: "123456789"
        FIREBASE_CLIENT_CERT_URL: https://test.com
        GEMINI_API_KEY: test-gemini-key
        CLOUDINARY_CLOUD_NAME: test-cloud
        CLOUDINARY_API_KEY: test-key
        CLOUDINARY_API_SECRET: test-secret
        GMAIL_USER: test@gmail.com
        GMAIL_APP_PASSWORD: test-password
        CORS_ORIGINS: http://localhost:3000
      run: |
        python -m pytest tests/integration -v -m integration --tb=short
  
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Ruff
      working-directory: ./backend
      run: ruff check app tests --output-format=github
    
    - name: Run Black
      working-directory: ./backend
      run: black --check app tests
    
    - name: Run isort
      working-directory: ./backend
      run: isort --check-only app tests
    
    - name: Run Bandit
      working-directory: ./backend
      run: bandit -r app -ll -f json -o bandit-report.json || true
    
    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: backend/bandit-report.json
